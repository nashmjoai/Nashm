# NASHM Configuration
# For full documentation: https://www.Nashm.ai/docs/configuration/Nashm_yaml

# Configuration version (required)
version: 1.3.13

# Cache settings
cache: true

# Default Model Specifications
modelSpecs:
  list:
    - name: "gemini-3.5-flash"
      label: "Gemini 3.5 Flash"
      description: "نموذج Google المتقدم والسريع"
      default: true
      preset:
        endpoint: "google"
        model: "gemini-3.5-flash"

# Custom interface configuration
interface:
  customWelcome: 'مرحباً بك في نشم!'
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true

#==================================================#
#                  API Endpoints                    #
#==================================================#
endpoints:
  custom:
    #------------------------------------------------
    # Kimi by Moonshot AI
    # Docs: https://platform.moonshot.cn/docs
    # Set KIMI_API_KEY in your .env file
    #------------------------------------------------
    - name: 'Kimi'
      apiKey: '${KIMI_API_KEY}'
      baseURL: 'https://api.moonshot.cn/v1'
      models:
        default:
          - 'moonshot-v1-8k'
          - 'moonshot-v1-32k'
          - 'moonshot-v1-128k'
          - 'kimi-latest'
        fetch: false
      titleConvo: true
      titleModel: 'moonshot-v1-8k'
      summarize: false
      summaryModel: 'moonshot-v1-8k'
      forcePrompt: false
      modelDisplayLabel: 'Kimi'
      iconURL: '/assets/kimi.png'
      # Parameters not supported by Moonshot API
      dropParams:
        - 'user'
        - 'frequency_penalty'
        - 'presence_penalty'
