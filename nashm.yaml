# NASHM Configuration
# For full documentation: https://www.Nashm.ai/docs/configuration/Nashm_yaml

# Configuration version (required)
version: 1.3.13

# Cache settings
cache: true

# Web Search configuration
webSearch:
  searchProvider: "serper"

# Default Model Specifications
modelSpecs:
  list:
    - name: "gemini-3.5-flash"
      label: "Gemini 3.5 Flash"
      description: "نموذج Google المتقدم والسريع"
      default: true
      preset:
        endpoint: "google"
        model: "gemini-3.5-flash"
      geminiImageGen: true
    - name: "kimi-agent"
      label: "Kimi Agent"
      description: "نموذج Kimi مع أدوات التفكير والبحث والصور (مثل Gemini)"
      preset:
        endpoint: "Kimi"
        model: "kimi-k2.5"
      webSearch: true
      executeCode: true
      geminiImageGen: true
      fileSearch: true

# Custom interface configuration
interface:
  customWelcome: "مرحباً بك في نشم!"
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true

#==================================================#
#                  API Endpoints                    #
#==================================================#
endpoints:
  custom:
    #------------------------------------------------
    # Kimi by Moonshot AI
    # Docs: https://platform.moonshot.cn/docs
    # Set KIMI_API_KEY in your .env file
    #------------------------------------------------
    - name: "Kimi"
      apiKey: "${KIMI_API_KEY}"
      baseURL: "https://api.moonshot.ai/v1"
      models:
        default:
          - "kimi-k2.5"
          - "kimi-k2.6"
          - "kimi-k2.7-code"
          - "kimi-latest"
          - "moonshot-v1-8k"
          - "moonshot-v1-32k"
          - "moonshot-v1-128k"
        fetch: false
      titleConvo: true
      titleModel: "kimi-k2.5"
      summarize: false
      summaryModel: "kimi-k2.5"
      forcePrompt: false
      modelDisplayLabel: "Kimi"
      iconURL: "/assets/kimi.svg"
      # Parameters not supported by Moonshot API
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
